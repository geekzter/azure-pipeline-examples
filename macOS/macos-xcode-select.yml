trigger: none
schedules:
- cron: '0 1 * * *'
  displayName: 'Nightly build (UTC)'
  always: 'true'
  branches:
    include:
    - main

variables:
  xcodeRoot: "/Applications/Xcode_27.1_Release_Candidate.app"

jobs:
- job: xcodeSelect
  pool:
    name: GitHub-hosted Agents
    vmImage: 'xcode-27'
  steps:
  - bash: |
      echo '##vso[task.setvariable variable=MD_APPLE_SDK_ROOT;]'$(xcodeRoot)
      sudo xcode-select --switch $(xcodeRoot)/Contents/Developer
      xcodebuild -version